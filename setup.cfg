[metadata]
name = filetype
version = 1.2.0
description = Infer file type and MIME type of any file/buffer. No external dependencies.
long_description = file: README.rst
keywords = file libmagic magic infer numbers magicnumbers discovery mime type kind
url = https://github.com/h2non/filetype.py
download_url = https://github.com/h2non/filetype.py/tarball/master
author = Tomas Aparicio
author_email = tomas@aparicio.me
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Console
    Environment :: Web Environment
    Intended Audience :: Developers
    Intended Audience :: System Administrators
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.5
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: System
    Topic :: System :: Filesystems
    Topic :: Utilities
platforms = any

[options]
packages = find:
zip_safe = True

[options.packages.find]
exclude =
    dist
    build
    docs
    tests
    examples

[options.package_data]
filetype = LICENSE, *.md

[options.entry_points]
console_scripts =
    filetype = filetype.__main__:main

[bdist_wheel]
universal = 1
